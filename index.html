<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>오늘의 운동 체크</title>

  <link rel="stylesheet" href="style.css?v=4">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ec6a1a">

  <link rel="apple-touch-icon" href="images/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="운동 체크">
</head>

<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-box">
      <p class="label">오늘의 운동</p>
      <h1>회원 로그인</h1>
      <p class="login-description">
        배정받은 운동 루틴을 확인해 보세요.
      </p>

      <form id="loginForm" class="login-form">
        <label for="loginEmail">이메일</label>
        <input id="loginEmail" type="email" autocomplete="email" required>

        <label for="loginPassword">비밀번호</label>

<div class="password-field">
  <input
    id="loginPassword"
    type="password"
    autocomplete="current-password"
    required
  >

  <button
    class="password-toggle"
    type="button"
    data-password-toggle="loginPassword"
    aria-label="비밀번호 보기"
    aria-pressed="false"
  >
    👁
  </button>
</div>

        <button id="loginButton" type="submit">로그인</button>
        <p id="loginMessage" class="login-message"></p>
      </form>
      <button id="showSignupButton" class="signup-link-button" type="button">
        처음이신가요? 회원가입
      </button>

      <form id="signupForm" class="login-form" hidden>
        <p class="label">회원가입</p>

        <label for="signupEmail">이메일</label>
        <input
          id="signupEmail"
          type="email"
          autocomplete="email"
          required
        >

        <label for="signupPassword">비밀번호</label>

        <div class="password-field">
          <input
            id="signupPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        
          <button
            class="password-toggle"
            type="button"
            data-password-toggle="signupPassword"
            aria-label="비밀번호 보기"
            aria-pressed="false"
          >
            👁
          </button>
        </div>

        <label for="signupPasswordConfirm">비밀번호 확인</label>

        <div class="password-field">
          <input
            id="signupPasswordConfirm"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        
          <button
            class="password-toggle"
            type="button"
            data-password-toggle="signupPasswordConfirm"
            aria-label="비밀번호 보기"
            aria-pressed="false"
          >
            👁
          </button>
        </div>

        <button id="signupButton" type="submit">회원가입</button>
        <p id="signupMessage" class="login-message"></p>

        <button
          id="hideSignupButton"
          class="signup-link-button"
          type="button"
        >
          로그인으로 돌아가기
        </button>
      </form>
      <img
  class="screen-logo screen-logo-bottom"
  src="images/center-logo.png"
  alt="헬스와 필라테스 화곡점"
>
    </div>
  </section>
  <main id="appScreen" class="app" hidden>
    <img
  class="screen-logo screen-logo-top"
  src="images/center-logo.png"
  alt="헬스와 필라테스 화곡점"
>
    <header class="header">
      <p class="label">오늘의 운동</p>
      <h1>운동을 하나씩<br>완료해 보세요</h1>
    </header>
    <div class="member-toolbar">
      <p>
        <span>배정 루틴</span>
        <strong id="assignedRoutineName">불러오는 중...</strong>
      </p>

      <button id="logoutButton" type="button">로그아웃</button>
    </div>
    <a
  id="routineRequestButton"
  class="routine-request-button"
  href="https://docs.google.com/forms/d/e/1FAIpQLScIH9uLzjwhGlH-RWbn9a7hmEy74MzQNLgN4Tnn4V01KcqKzg/viewform?usp=header"
  target="_blank"
  rel="noopener noreferrer"
>
  ✍️ 새 루틴 신청하기
</a>
    <figure class="routine-image">
      <img id="routineImage" src="images/routine-guide.png" alt="월간 운동 루틴 안내표">
    </figure>
    <section id="routineDescription" class="routine-description" hidden></section>
    <button
  id="toggleRoutineDescriptionButton"
  class="toggle-description-button"
  type="button"
  hidden
  aria-expanded="false"
>
  설명 더 보기
</button>
    <button id="openImageButton" class="zoom-button" type="button">
      🔍 루틴표 크게 보기
    </button>

    <button id="installButton" class="install-button" type="button" hidden>
      📲 이 앱을 홈 화면에 설치
    </button>
    <img
  class="screen-logo screen-logo-bottom"
  src="images/center-logo.png"
  alt="헬스와 필라테스 화곡점"
>
  </main>

  <main id="adminScreen" class="app admin-screen" hidden>
    <img
  class="screen-logo screen-logo-top"
  src="images/center-logo.png"
  alt="헬스와 필라테스 화곡점"
>
    <header class="header">
      <p class="label">관리자 페이지</p>
      <h1>회원 루틴 관리</h1>
    </header>

    <section class="admin-card">
      <label for="adminMemberSelect">회원 선택</label>

      <select id="adminMemberSelect">
        <option value="">회원 목록을 불러오는 중...</option>
      </select>

      <p id="adminMemberInfo" class="admin-message">
        루틴을 관리할 회원을 선택해 주세요.
      </p>
    </section>

    <section id="adminRoutineEditor" class="admin-card" hidden>
      <label for="adminRoutineName">루틴 이름</label>
      <input id="adminRoutineName" type="text" placeholder="예: 2026년 9월 운동 루틴">

      <label for="adminRoutineImage">루틴 이미지</label>
      <input id="adminRoutineImage" type="file" accept="image/png, image/jpeg, image/webp">

      <img id="adminRoutinePreview" alt="선택한 루틴 이미지 미리보기" hidden>
      <label for="adminRoutineDescription">루틴 설명과 링크</label>

      <textarea
        id="adminRoutineDescription"
        rows="9"
        placeholder="회원에게 보여줄 설명을 입력하세요.
      
      링크는 https://... 형식으로 붙여넣으면 자동으로 클릭할 수 있습니다."
      ></textarea>
      <button id="saveAdminRoutineButton" type="button">
        회원 루틴 저장
      </button>

      <p id="adminSaveMessage" class="admin-message"></p>
    </section>

    <button id="adminLogoutButton" class="zoom-button" type="button">
      로그아웃
    </button>
    <img
  class="screen-logo screen-logo-bottom"
  src="images/center-logo.png"
  alt="헬스와 필라테스 화곡점"
>
  </main>

  <div id="imageModal" class="image-modal">
    <button id="closeImageButton" class="close-image-button" type="button" aria-label="크게 보기 닫기">
      ×
    </button>

    <img src="images/routine-guide.png" alt="확대된 월간 운동 루틴 안내표">
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="script.js?v=4"></script>
</body>


</html>
